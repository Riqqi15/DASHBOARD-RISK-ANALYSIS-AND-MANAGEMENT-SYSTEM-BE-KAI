previews:
  generation: off

services:
  - type: pserv
    name: kai-rams-mysql
    runtime: docker
    region: singapore
    plan: 1c-2g
    dockerfilePath: ./docker/mysql/Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    disk:
      name: kai-rams-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: rams
      - key: MYSQL_USER
        value: rams
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: TZ
        value: Asia/Jakarta

  - type: keyvalue
    name: kai-rams-redis
    region: singapore
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: kai-rams-web
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    preDeployCommand: kai-rams-predeploy
    initialDeployHook: php artisan db:seed --class=AdminUserSeeder --force
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_NAME
        value: KAI RAMS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: APP_URL
        fromService:
          type: web
          name: kai-rams-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_KEY_BASE64
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          type: pserv
          name: kai-rams-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        fromService:
          type: pserv
          name: kai-rams-mysql
          envVarKey: MYSQL_DATABASE
      - key: DB_USERNAME
        fromService:
          type: pserv
          name: kai-rams-mysql
          envVarKey: MYSQL_USER
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: kai-rams-mysql
          envVarKey: MYSQL_PASSWORD
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kai-rams-redis
          property: connectionString
      - key: REDIS_QUEUE
        value: default
      - key: REDIS_QUEUE_RETRY_AFTER
        value: "1200"
      - key: FILESYSTEM_DISK
        value: local
      - key: RAMS_IMPORT_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "false"
      - key: RAMS_ADMIN_NAME
        sync: false
      - key: RAMS_ADMIN_USERNAME
        sync: false
      - key: RAMS_ADMIN_EMAIL
        sync: false
      - key: RAMS_ADMIN_PASSWORD
        sync: false
      - key: RAMS_SEED_DEMO_ACCOUNTS
        value: "false"

  - type: worker
    name: kai-rams-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: php artisan queue:work redis --queue=rams-imports,default --sleep=1 --tries=2 --timeout=900
    maxShutdownDelaySeconds: 300
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_NAME
        value: KAI RAMS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: APP_URL
        fromService:
          type: web
          name: kai-rams-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_KEY_BASE64
        fromService:
          type: web
          name: kai-rams-web
          envVarKey: APP_KEY_BASE64
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          type: pserv
          name: kai-rams-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        fromService:
          type: pserv
          name: kai-rams-mysql
          envVarKey: MYSQL_DATABASE
      - key: DB_USERNAME
        fromService:
          type: pserv
          name: kai-rams-mysql
          envVarKey: MYSQL_USER
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: kai-rams-mysql
          envVarKey: MYSQL_PASSWORD
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kai-rams-redis
          property: connectionString
      - key: REDIS_QUEUE
        value: default
      - key: REDIS_QUEUE_RETRY_AFTER
        value: "1200"
      - key: FILESYSTEM_DISK
        value: local
      - key: RAMS_IMPORT_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        fromService:
          type: web
          name: kai-rams-web
          envVarKey: AWS_ACCESS_KEY_ID
      - key: AWS_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: kai-rams-web
          envVarKey: AWS_SECRET_ACCESS_KEY
      - key: AWS_DEFAULT_REGION
        fromService:
          type: web
          name: kai-rams-web
          envVarKey: AWS_DEFAULT_REGION
      - key: AWS_BUCKET
        fromService:
          type: web
          name: kai-rams-web
          envVarKey: AWS_BUCKET
      - key: AWS_ENDPOINT
        fromService:
          type: web
          name: kai-rams-web
          envVarKey: AWS_ENDPOINT
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "false"
      - key: RAMS_SEED_DEMO_ACCOUNTS
        value: "false"
